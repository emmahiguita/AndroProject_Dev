[package]
name = "androproject-desktop"
version = "2.1.0"
description = "AndroProject - Ultra-lightweight native Android Manager with WebView2"
authors = ["emmahiguita"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
