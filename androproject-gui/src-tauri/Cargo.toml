[package]
name = "androproject-desktop"
version = "3.2.0"
description = "ANDRO-IOS - Native Android & iOS Device Studio"
authors = ["emmahiguita"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
